<!doctype html>
<html lang="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Endgame Nirvana" />
    <title>Endgame Nirvana</title>

    <!-- link-preview:default
      Link preview for every page that carries no puzzle of its own (the site root,
      /progress, /browse, /about, and /train before a puzzle is picked). A shared puzzle
      link replaces this whole block at the edge with tags for that position — see
      preview/preview.ts; keep the two in step. og:image is the board renderer at
      /og/board.png rather than a committed picture, so the default preview is drawn by
      the very code that draws the puzzle ones, from one of our own puzzles.
    -->
    <meta
      name="description"
      content="The place to practice your endgames — where endgames become second nature."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Endgame Nirvana" />
    <meta property="og:title" content="Welcome to Endgame Nirvana" />
    <meta
      property="og:description"
      content="The place to practice your endgames — where endgames become second nature."
    />
    <meta property="og:url" content="https://endgame-nirvana.space/" />
    <meta
      property="og:image"
      content="https://endgame-nirvana.space/og/board.png?puzzle=4k3%2F5r2%2F4K3%2F4B3%2F8%2F8%2F7R%2F8_w_-_-_0_1"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Chess board: a rook and bishop endgame position" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
